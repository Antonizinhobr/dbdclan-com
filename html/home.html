<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead by Daylight - Map Selection</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="icon" href="../assets/icon.jpg" type="image/jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="fade-in">

    <header>
        <div class="logo">DEAD BY DAYLIGHT</div>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-link" style="margin-right: 20px;">
                </i> Home
            </a>

            <a href="#" class="nav-link active">Votação</a>

            <div class="nav-dropdown">
                <a href="teams.html" class="nav-link">Times <i class="fas fa-chevron-down"
                        style="font-size: 0.6rem; margin-left: 5px;"></i></a>
                <div class="dropdown-content">
                    <a href="teams.html?camp=1">Campeonato 1</a>
                </div>
            </div>

            <a href="perks.html" class="nav-link">Perks Banidas</a>
        </nav>

        <div class="user-container" id="user-profile-trigger"
            style="display: flex; align-items: center; cursor: pointer; position: relative;">
            <span id="display-name"
                style="margin-right: 15px; font-size: 0.8rem; color: #ff0000; text-transform: uppercase; font-weight: bold;">...</span>
            <div class="avatar-circle"
                style="width: 45px; height: 45px; border: 2px solid #ff0000; border-radius: 50%; overflow: hidden; background: #111;">
                <img src="../assets/icon.jpg" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div id="user-submenu" class="hidden"
                style="position: absolute; top: 60px; right: 0; background: #111; border: 1px solid #333; padding: 15px; z-index: 100; min-width: 180px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
                <button id="logout-btn"
                    style="background:none; border:none; color:#ff0000; cursor:pointer; width: 100%; text-align: left; font-family: 'Arial Black'; font-size: 0.7rem; text-transform: uppercase;">SAIR
                    DA NÉVOA</button>
            </div>
        </div>
    </header>

    <main>
        <div class="info-section">
            <h1 id="main-title">Votação de Reinos</h1>
            <p id="status-text">Analise os reinos disponíveis...</p>

            <div id="admin-controls" class="hidden"
                style="margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <button id="start-btn"
                    style="width: 180px; padding: 12px; background: transparent; border: 1px solid #00ff00; color: #00ff00; cursor: pointer; font-family: 'Arial Black'; text-transform: uppercase;">INICIAR
                    VOTAÇÃO</button>
                <button id="finish-btn"
                    style="width: 180px; padding: 12px; background: transparent; border: 1px solid #ff0000; color: #ff0000; cursor: pointer; font-family: 'Arial Black'; text-transform: uppercase;">FINALIZAR</button>
                <button id="reset-btn"
                    style="width: 180px; padding: 12px; background: transparent; border: 1px solid #fff; color: #fff; cursor: pointer; font-family: 'Arial Black'; text-transform: uppercase;">REINICIAR
                    TUDO</button>
            </div>
        </div>

        <div class="map-grid" id="map-grid"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARpVKfzOMm-v0pv9-7w9xahvhItosrI2Q",
            authDomain: "dbd-camp.firebaseapp.com",
            projectId: "dbd-camp",
            storageBucket: "dbd-camp.firebasestorage.app",
            messagingSenderId: "357760091556",
            appId: "1:357760091556:web:4d9191b487baf240e92d31",
            measurementId: "G-THBBGJTTMJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // Substitua a lista antiga por esta de IDs Reais
        const ADMIN_UIDS = [
            "discord:1400218900284571689",
            "discord:392062765323255828",
            "discord:644323555462479892",
            "discord:804843307568988180",
            "discord:361362105363857408",
            "discord:208380369261559808"
        ];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Exibe o nome (mesmo sem email)
                const userName = user.displayName || "SOBREVIVENTE";
                document.getElementById('display-name').innerText = userName.toUpperCase();

                // Verificação infalível por UID
                const isAdmin = ADMIN_UIDS.includes(user.uid);

                if (isAdmin) {
                    console.log("Admin detectado!");
                    const controls = document.getElementById('admin-controls');
                    if (controls) controls.classList.remove('hidden');
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('user-profile-trigger').onclick = (e) => {
            e.stopPropagation();
            document.getElementById('user-submenu').classList.toggle('hidden');
        };
        window.onclick = () => document.getElementById('user-submenu').classList.add('hidden');
        document.getElementById('logout-btn').onclick = () => signOut(auth);
    </script>
    <script type="module" src="../js/index.js"></script>
</body>

</html>
