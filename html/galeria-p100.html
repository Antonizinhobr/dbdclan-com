<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DbD - Galeria de Honra P100</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/p100.css">
    <link rel="icon" href="../assets/icon.jpg" type="image/jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gallery-card {
            background: linear-gradient(145deg, #1a0000 0%, #3a0000 100%);
            border: 1px solid var(--accent-red);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
            transition: 0.3s;
        }
        .gallery-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.5);
        }
        .gallery-char-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 2px solid gold;
            margin-bottom: 10px;
            object-fit: cover;
        }
        .gallery-player-name {
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
        .gallery-char-name {
            color: gold;
            font-family: var(--font-game);
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .gallery-proof-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid #555;
            color: #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .gallery-proof-btn:hover {
            background: #222;
            color: #fff;
            border-color: var(--accent-red);
        }
    </style>
</head>
<body class="fade-in">

    <header>
        <div class="logo">DEAD BY DAYLIGHT</div>
        <nav class="nav-menu">
            <a href="#" class="nav-link">Home</a>
            <a href="home.html" class="nav-link">Votação</a>
            <a href="teams.html" class="nav-link">Times</a>
            <a href="bracket.html" class="nav-link">Chaves</a>
            <a href="p100.html" class="nav-link">P100</a>
            <a href="galeria-p100.html" class="nav-link active" style="color: gold;"><i class="fas fa-star"></i> Galeria P100</a>
        </nav>
    </header>

    <main class="main-padding" style="padding-top: 120px;">
        <div class="info-section transparent-bg">
            <h1>HALL DA FAMA P100</h1>
            <p>Os jogadores mais dedicados que alcançaram a perfeição na Névoa.</p>
        </div>

        <div style="max-width: 1200px; margin: 40px auto; padding: 20px;">
            <div id="gallery-grid" class="tickets-grid">
                <p style="color: #888; text-align: center; grid-column: 1/-1;">Carregando lendas...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARpVKfzOMm-v0pv9-7w9xahvhItosrI2Q",
            authDomain: "dbd-camp.firebaseapp.com",
            projectId: "dbd-camp",
            storageBucket: "dbd-camp.firebasestorage.app",
            messagingSenderId: "357760091556",
            appId: "1:357760091556:web:4d9191b487baf240e92d31",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const grid = document.getElementById("gallery-grid");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const q = query(collection(db, "tickets_p100"), where("status", "==", "approved"));
                
                onSnapshot(q, (snap) => {
                    grid.innerHTML = "";

                    if(snap.empty) {
                        grid.innerHTML = "<p style='color: #888; text-align: center; grid-column: 1/-1;'>Ninguém alcançou o topo ainda. Seja o primeiro!</p>";
                        return;
                    }

                    snap.forEach((docSnap) => {
                        const data = docSnap.data();
                        
                        const card = document.createElement("div");
                        card.className = "gallery-card";
                        card.innerHTML = `
                            <div style="position: relative; display: inline-block;">
                                <img src="${data.charImgPath}" class="gallery-char-img">
                                <div style="position: absolute; bottom: 0; right: -10px; background: gold; color: #000; font-weight: bold; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 2px solid #000; font-size: 0.8rem;">100</div>
                            </div>
                            <div class="gallery-player-name">${data.userName}</div>
                            <div class="gallery-char-name">${data.character}</div>
                            <button class="gallery-proof-btn" onclick="window.open('${data.proofImg}', '_blank')">
                                <i class="fas fa-image"></i> Ver Prova
                            </button>
                        `;
                        grid.appendChild(card);
                    });
                }, (error) => {
                    console.error("Erro ao carregar galeria:", error);
                    grid.innerHTML = "<p style='color: red; text-align: center; grid-column: 1/-1;'>Erro ao carregar dados. Verifique as permissões.</p>";
                });
            } else {
                grid.innerHTML = "<p style='color: #888; text-align: center; grid-column: 1/-1;'>Inicie sessão para ver a galeria de honra.</p>";
            }
        });
    </script>
</body>
</html>
