        const killerGrid = document.getElementById('killer-grid');
        const survivorGrid = document.getElementById('survivor-grid');
        const modal = document.getElementById('perk-modal');
        
        const mImg = document.getElementById('m-img');
        const mType = document.getElementById('m-type');
        const mName = document.getElementById('m-name');
        const mDesc = document.getElementById('m-desc');

        function renderPerks() {
            perksData.forEach(perk => {
                const el = document.createElement('div');
                el.className = 'perk-icon-wrapper';
                el.onclick = () => openModal(perk);
                el.innerHTML = `<img src="${perk.img}" alt="${perk.name}">`;

                if (perk.type === 'killer') {
                    killerGrid.appendChild(el);
                } else {
                    survivorGrid.appendChild(el);
                }
            });
        }

        function openModal(data) {
            mImg.src = data.img;
            mType.innerText = data.label;
            mName.innerText = data.name;
            mDesc.innerText = data.description;

            modal.classList.add('open');
        }

        function closeModal(event) {
            if (event.target === modal || event.target.classList.contains('close-modal-btn')) {
                modal.classList.remove('open');
            }
        }

        renderPerks();
